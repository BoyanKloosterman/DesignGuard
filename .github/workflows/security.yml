# SCA: NuGet vulnerability audit + dotnet list --vulnerable
# SAST: Microsoft CodeQL voor C#
name: Security (SCA & SAST)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Standaard minimaal; codeql-job vult security-events zelf aan
permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sca:
    name: SCA (NuGet)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore (audit-waarschuwingen = fout)
        run: dotnet build DesignGuard.sln -t:Restore -warnaserror:NU1901,NU1902,NU1903,NU1904

      - name: Lijst kwetsbare packages
        run: dotnet list DesignGuard.sln package --vulnerable --include-transitive --format console

      - name: Build & test
        run: |
          dotnet build DesignGuard.sln --no-restore -c Release
          dotnet test DesignGuard.sln --no-build -c Release

  codeql:
    name: SAST (CodeQL)
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      # upload: never — voorkomt fout als Code Scanning in repo-instellingen nog uit staat.
      # Na inschakelen (Settings → Code security → Code scanning): regel verwijderen of upload: always.
      - name: Perform CodeQL Analysis
        id: codeql-analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:csharp"
          upload: never

      - name: CodeQL SARIF artifact
        uses: actions/upload-artifact@v7
        with:
          name: codeql-csharp-sarif
          path: ${{ steps.codeql-analyze.outputs.sarif-output }}
          if-no-files-found: warn
